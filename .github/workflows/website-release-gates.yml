name: Website release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r requirements-pdf.txt
      - run: python scripts/validate_gate_ee_set01_commercial_authorization.py
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=moderate
      - run: git diff --check
